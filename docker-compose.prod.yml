name: dockerfile-trainer-prod

services:
  api:
    build:
      context: ./integracao-hellow
    env_file:
      - .env.prod
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "127.0.0.1:8003:8001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pauta-prod

  postgres:
    image: postgres:18
    env_file:
      - .env.prod
    environment:
      POSTGRES_HOST: postgres
    volumes:
      - pgdata_prod:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - pauta-prod

volumes:
  pgdata_prod:

networks:
  pauta-prod:
    driver: bridge
